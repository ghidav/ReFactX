[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "refactx"
version = "0.1.2"
description = "Refactx package"
readme = "Readme-pip.md"
license = "Apache-2.0"
authors = [ { name = "Riccardo Pozzi" } ]
requires-python = ">=3.8"

dependencies = [
	"tqdm",
	"python-dotenv",
	"click",
	"psycopg[binary]>=3.0",
	"cachetools",
	"requests",
]

[project.optional-dependencies]
torch = [
	"torch",
	"transformers>=4.0",
	"accelerate",
]
httpindex = [
	"flask",
	"gunicorn",
]
# Constrained generation through vLLM (refactx.vllm_proc:RefactxLogitsProcessor).
# Pinned to the range TRL supports so it can share a training/inference env.
# Opt in explicitly per engine via `logits_processors=[...]` (offline) or
# `vllm serve ... --logits-processors refactx.vllm_proc:RefactxLogitsProcessor`
# (server). Intentionally NOT a `vllm.logits_processors` entry point, which would
# load it for every request and require REFACTX_INDEX even when vLLM is used for
# something else in the same environment.
vllm = [
	"vllm>=0.12.0,<=0.18.0",
]

[project.scripts]
refactx-populate-postgres = "refactx.cli.populate_postgres:main"
refactx-debug-postgres = "refactx.cli.debug_postgres:main"

[tool.setuptools.packages.find]
include = ["refactx*"]

[project.urls]
Homepage = "https://github.com/rpo19/ReFactX"
Repository = "https://github.com/rpo19/ReFactX"
"Bug Tracker" = "https://github.com/rpo19/ReFactX/issues"
